<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HOI Dashboard</title>
  <link rel="stylesheet" href="https://cdn.gitam.edu/vendor/bootstrap-5.2.3/css/bootstrap.min.css">
</head>
<body style="background:#f4f6f5">
  <div class="container py-5" style="max-width:720px">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <span class="badge bg-dark mb-2">{{ user.get_role_display }}</span>
        <h4 class="mb-3">Head of Institution Dashboard</h4>
        <p class="text-muted">Welcome, {{ user.get_full_name|default:user.username }}.</p>
        <p>This is where institution-wide booking approvals will live.</p>

        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
